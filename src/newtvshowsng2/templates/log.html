<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080c16">
  <meta http-equiv="refresh" content="10">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Log · NewTVShowsNG2</title>
  <style>
    :root { color-scheme: dark; --background: #080c16; --surface: #101725; --border: #263249; --text: #edf2ff; --muted: #98a6bd; --link: #a9bcff; --warning: #ffc76a; }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--background); }
    body { min-height: 100vh; margin: 0; background: var(--background); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.45; }
    a { color: var(--link); text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid var(--warning); outline-offset: 3px; border-radius: 4px; }
    .shell { width: min(1320px, calc(100% - 32px)); margin: 0 auto; padding: 22px 0 52px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 26px; padding-bottom: 15px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: .86rem; }
    .nav { display: flex; gap: 16px; }
    .nav a { color: var(--muted); font-weight: 750; text-decoration: none; }
    .nav a[aria-current="page"] { color: var(--text); }
    .meta { text-align: right; }
    .heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 10px; }
    h1 { margin: 0; font-size: 1.22rem; letter-spacing: -.02em; }
    p { margin: 3px 0 0; color: var(--muted); font-size: .86rem; }
    .count { color: var(--muted); font-size: .82rem; font-weight: 700; white-space: nowrap; }
    .log { min-height: 280px; margin: 0; padding: 16px; overflow: auto; border: 1px solid var(--border); border-radius: 13px; background: var(--surface); color: #d8e1f3; font: .78rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty { color: var(--muted); }
    @media (max-width: 600px) { .shell { width: calc(100% - 20px); padding-top: 14px; } .topbar, .heading { align-items: flex-start; } .nav { flex-direction: column; gap: 5px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <nav class="nav" aria-label="Hauptnavigation">
        <a href="/">Übersicht</a>
        <a href="/log" aria-current="page">Log</a>
      </nav>
      <span class="meta">Automatische Aktualisierung alle 10 Sekunden<br>{{ generated_at }}</span>
    </header>
    <div class="heading">
      <div>
        <h1>Aktuelles Log</h1>
        <p>Rotierend gespeichert; angezeigt werden höchstens {{ line_limit }} Zeilen.</p>
      </div>
      <span class="count">{{ line_count }} Zeilen</span>
    </div>
    {% if log_text %}<pre class="log">{{ log_text }}</pre>{% else %}<div class="log empty">Noch keine Logeinträge vorhanden.</div>{% endif %}
  </main>
</body>
</html>
