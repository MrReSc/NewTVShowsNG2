<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#121212">
  <meta http-equiv="refresh" content="10">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Log · NewTVShowsNG2</title>
  <style>
    :root { color-scheme: dark; --background: #121212; --surface: #191919; --border: #303030; --text: #f5f5f5; --muted: #a9a9a9; --accent: #00d8c1; --accent-soft: #0c302d; --link: #53e4d3; --visited: #c4a0f7; }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--background); }
    body { min-height: 100vh; margin: 0; color: var(--text); background: var(--background); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.5; }
    a { color: var(--link); text-underline-offset: 3px; }
    a:visited { color: var(--visited); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    .shell { width: min(1320px, calc(100% - 48px)); margin: 0 auto; padding: 28px 0 52px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 25px; border-bottom: 1px solid var(--border); }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--text); font-weight: 800; letter-spacing: -.035em; text-decoration: none; }
    .brand:visited { color: var(--text); }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 5px; background: #1e1e1e; color: var(--text); font-size: 1rem; font-weight: 900; }
    .meta { color: var(--muted); font-size: .78rem; text-align: right; }
    .nav { position: sticky; z-index: 5; top: 0; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; padding: 12px 0; border-bottom: 1px solid var(--border); background: #121212f2; backdrop-filter: blur(14px); }
    .nav a { padding: 9px 13px; border: 1px solid #292929; border-radius: 5px; background: #101010; color: var(--text); font: .82rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-decoration: none; }
    .nav a:hover { color: var(--text); background: #222; }
    .nav a[aria-current="page"] { border-color: #f5f5f5; background: var(--text); color: #121212; }
    .heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 16px; }
    .heading h1 { margin: 0; font: 400 1.25rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: -.03em; }
    .count { flex: 0 0 auto; padding: 5px 9px; border: 1px solid var(--border); border-radius: 5px; color: var(--muted); font: .73rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .log { min-height: 280px; margin: 0; padding: 20px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: #ddd; font: .78rem/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty { color: var(--muted); }
    @media (max-width: 760px) { .shell { width: min(100% - 24px, 680px); padding-top: 16px; } .topbar, .heading { align-items: flex-start; } }
    @media (max-width: 470px) { .brand { font-size: .9rem; } .nav a { padding: 8px 10px; font-size: .78rem; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">N</span>NewTVShowsNG2</a>
      <span class="meta">Automatische Aktualisierung alle 10 Sekunden<br>{{ generated_at }}</span>
    </header>
    <nav class="nav" aria-label="Ansichten">
      <a href="/#overview">Feed</a>
      <a href="/#media-import">Medienimport</a>
      <a href="/#history">Historie</a>
      <a href="/log" aria-current="page">Log</a>
    </nav>
    <div class="heading">
      <div>
        <h1>Aktuelles Log</h1>
      </div>
      <span class="count">{{ line_count }} Zeilen</span>
    </div>
    {% if log_text %}<pre class="log">{{ log_text }}</pre>{% else %}<div class="log empty">Noch keine Logeinträge vorhanden.</div>{% endif %}
  </main>
</body>
</html>
