[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "newtvshowsng2"
version = "1.0.0"
description = "RSS release tracker for Jellyfin 12"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11,<7",
  "Jinja2>=3.1.6,<4",
  "requests>=2.32.5,<3",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[project.scripts]
newtvshowsng2 = "newtvshowsng2.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
newtvshowsng2 = ["templates/*.html", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
